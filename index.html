<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e2a44">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>会計帳簿</title>
<style>
:root{
  --bg:#f3f5f9; --card:#fff; --ink:#1c2333; --sub:#5d6678; --line:#e1e5ee; --soft:#f6f8fb;
  --pri:#2457c5; --pri-weak:#e8eefc; --ok:#12804a; --ok-weak:#e2f4e9; --bad:#c42e2e; --bad-weak:#fdebeb;
  --warn:#9a5b00; --warn-weak:#fff3dd; --nav:#1e2a44; --exp:#e0782b; --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Noto Sans JP","Hiragino Sans","Yu Gothic UI",sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:flex;min-height:100vh}
/* ---- サイドメニュー（横長・広い画面） ---- */
.side{width:196px;flex-shrink:0;background:var(--nav);color:#fff;position:sticky;top:0;height:100vh;overflow-y:auto;padding:calc(14px + env(safe-area-inset-top)) 10px 14px calc(10px + env(safe-area-inset-left))}
.side .brand{font-weight:700;font-size:18px;padding:6px 10px 14px;line-height:1.3}
.side .brand small{display:block;font-weight:400;font-size:12px;opacity:.7;margin-top:2px;word-break:break-all}
.side button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:#dfe5f2;padding:12px 12px;border-radius:10px;font-size:16px;text-align:left;cursor:pointer;min-height:48px}
.side button.on{background:#34446a;color:#fff;font-weight:700}
.side .ico{width:24px;text-align:center;font-size:18px}
.side hr{border:0;border-top:1px solid #34446a;margin:10px 4px}
/* ---- 下のメニュー（縦長・せまい画面） ---- */
.bottom{display:none;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--nav);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
.bottom button{flex:1;border:0;background:none;color:#cfd7e8;font-size:11px;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:1px;border-radius:8px;min-height:52px;cursor:pointer}
.bottom button .ico{font-size:20px;line-height:1.2}
.bottom button.on{color:#fff;background:#34446a;font-weight:700}
main{flex:1;min-width:0;padding:calc(14px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) 40px 18px;max-width:1240px}
@media (max-width:859px){
  .side{display:none} .bottom{display:flex}
  main{padding:calc(10px + env(safe-area-inset-top)) 12px 96px}
}
/* ---- 見出し・サブメニュー・期間 ---- */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.top h1{font-size:22px;margin:0}
.subtabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;margin-bottom:6px;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{flex-shrink:0;border:1px solid var(--line);background:#fff;padding:9px 16px;border-radius:999px;font-size:15px;cursor:pointer;min-height:44px;white-space:nowrap}
.subtabs button.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
.period{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.period select{min-height:44px}
.months{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.months::-webkit-scrollbar{display:none}
.months button{flex-shrink:0;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;min-height:40px;min-width:44px;cursor:pointer;font-size:14px}
.months button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
/* ---- 部品 ---- */
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:0 1px 2px rgba(20,30,60,.06);margin-bottom:14px}
.card h2{font-size:18px;margin:0 0 12px}
.card h3{font-size:16px;margin:16px 0 8px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px}
.kpi{background:#fff;border-radius:var(--r);padding:14px 16px;box-shadow:0 1px 2px rgba(20,30,60,.06)}
.kpi .l{font-size:13px;color:var(--sub)}
.kpi .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap}
.kpi .v small{font-size:13px;font-weight:400;margin-left:2px}
.muted{color:var(--sub)} .small{font-size:13px} .num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.plus{color:var(--ok)} .minus{color:var(--bad)}
label.f{display:block;font-size:14px;color:var(--sub);margin:12px 0 4px;font-weight:600}
.inp,select.inp,textarea.inp{width:100%;border:1px solid #cfd5e1;border-radius:10px;padding:10px 12px;background:#fff;min-height:48px;font-size:16px}
.inp:focus{outline:2px solid var(--pri);outline-offset:0;border-color:var(--pri)}
.inp.big{font-size:26px;font-weight:700;text-align:right;min-height:60px;font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid #cfd5e1;background:#fff;border-radius:10px;padding:10px 18px;min-height:48px;cursor:pointer;font-size:16px;font-weight:600;text-decoration:none}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.danger{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:none;color:var(--pri)}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{flex:1 1 auto;border:2px solid #cfd5e1;background:#fff;border-radius:10px;padding:10px 12px;min-height:50px;cursor:pointer;font-size:15px;font-weight:600}
.seg button.on{border-color:var(--pri);background:var(--pri-weak);color:var(--pri)}
.kind{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.kind button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:14px;font-size:18px;font-weight:700;cursor:pointer;min-height:64px}
.kind button.on.inc{border-color:var(--pri);background:var(--pri-weak);color:var(--pri)}
.kind button.on.exp{border-color:var(--exp);background:#fdf0e6;color:#b35610}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;min-height:38px}
.note{background:var(--soft);border-radius:10px;padding:10px 14px;font-size:14px;color:var(--sub)}
.note.warn{background:var(--warn-weak);color:var(--warn)}
.note.ok{background:var(--ok-weak);color:var(--ok)}
.note.bad{background:var(--bad-weak);color:var(--bad)}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--soft);font-size:13px;color:var(--sub);text-align:left;font-weight:600;white-space:nowrap;position:sticky;top:0}
tr:last-child td{border-bottom:0}
tr.tot td{font-weight:700;background:var(--soft)}
tr.grp td{background:#eef1f7;font-weight:700;font-size:14px}
td.acts{white-space:nowrap;text-align:right}
td .multi div{white-space:nowrap}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--pri-weak);color:var(--pri);margin-left:4px;white-space:nowrap;vertical-align:1px}
.badge.gray{background:#eceff4;color:var(--sub)}
.badge.org{background:#fdf0e6;color:#b35610}
.stmt .ln{display:flex;justify-content:space-between;gap:10px;padding:6px 2px;border-bottom:1px dashed var(--line)}
.stmt .ln.h{font-weight:700;border-bottom:1px solid var(--ink);margin-top:10px}
.stmt .ln.t{font-weight:700;background:var(--soft);border-bottom:0;padding:8px 6px;border-radius:6px;margin-top:4px}
.stmt .ln.big{font-size:18px}
.stmt .ln .num{font-weight:inherit}
.stmt .ln.in{padding-left:14px}
.hbar{display:grid;grid-template-columns:minmax(80px,140px) 1fr auto;gap:8px;align-items:center;font-size:14px;margin:5px 0}
.hbar .bar{height:16px;border-radius:4px;background:var(--exp)}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:13px;color:var(--sub);margin-top:4px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.list-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.empty{text-align:center;color:var(--sub);padding:28px 10px}
.check{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
.check input{width:22px;height:22px}
details.help{border:1px solid var(--line);border-radius:10px;padding:0 14px;margin:8px 0;background:#fff}
details.help summary{cursor:pointer;padding:12px 0;font-weight:700}
details.help[open]{padding-bottom:12px}
/* ---- ダイアログ・お知らせ ---- */
.mask{position:fixed;inset:0;background:rgba(15,20,35,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.dialog{background:#fff;border-radius:16px;width:100%;max-width:560px;max-height:calc(100vh - 32px);overflow-y:auto;padding:20px}
.dialog h3{margin:0 0 10px;font-size:19px}
.dialog .dbody p{margin:0 0 8px;white-space:pre-line}
.dialog .dbtns{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.dialog .derr{color:var(--bad);font-size:14px;margin-top:8px;min-height:1em}
#toast-root{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom));z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:92vw}
@media (max-width:859px){#toast-root{bottom:calc(76px + env(safe-area-inset-bottom))}}
.toast{background:#1c2333;color:#fff;border-radius:12px;padding:12px 16px;display:flex;gap:14px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:15px}
.toast button{background:none;border:0;color:#9ec1ff;font-weight:700;font-size:15px;cursor:pointer;padding:6px}
@media print{.side,.bottom,.subtabs,.period,.no-print{display:none!important} main{padding:0} .card{box-shadow:none}}
</style>
</head>
<body>
<div id="app">
  <nav class="side" id="side"></nav>
  <main id="main"></main>
</div>
<nav class="bottom" id="bottom"></nav>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
'use strict';
/* =========================================================
   会計帳簿（個人事業主向け）
   データはこの端末の中（localStorage）だけに保存されます。
   ========================================================= */
const APP_VERSION = '1.1.0';
const STORE_KEY = 'kaikei_pwa_v1';
const UI_KEY = 'kaikei_pwa_ui';
const OLD_KEY = 'accountingData_v5'; // パソコン版（V3.7）の保存名

const FIXED = ['建物','建物附属設備','機械装置','車両運搬具','工具器具備品','一括償却資産','ソフトウェア'];
const CAT_ORDER = ['資産','負債','純資産','収益','費用','控除資産'];
// アプリが計算で使う科目（削除・名前変更できない）
const CORE = {'資産':['現金','普通預金','売掛金','商品','事業主貸'],'負債':['未払金','借入金','事業主借'],'純資産':['元入金'],'収益':['売上'],'費用':['仕入','減価償却費'],'控除資産':['減価償却累計額']};
const DEFAULT_ACCOUNTS = {
  '資産':['現金','普通預金','売掛金','商品','前払金','建物','建物附属設備','機械装置','車両運搬具','工具器具備品','一括償却資産','ソフトウェア','事業主貸'],
  '負債':['買掛金','未払金','借入金','預り金','未払費用','事業主借'],
  '純資産':['元入金'],
  '収益':['売上','雑収入'],
  '費用':['仕入','租税公課','荷造運賃','水道光熱費','旅費交通費','通信費','広告宣伝費','接待交際費','損害保険料','修繕費','消耗品費','減価償却費','福利厚生費','給料賃金','外注工賃','利子割引料','地代家賃','貸倒金','支払手数料','車両費','新聞図書費','会議費','雑費'],
  '控除資産':['減価償却累計額']
};
const DEFAULT_COST = {'地代家賃':'fixed','水道光熱費':'fixed','通信費':'fixed','損害保険料':'fixed','租税公課':'fixed','減価償却費':'fixed','給料賃金':'fixed','利子割引料':'fixed','福利厚生費':'fixed','仕入':'variable','消耗品費':'variable','支払手数料':'variable','荷造運賃':'variable','外注工賃':'variable'};
// 消費税がかからないことが多い科目（かんたん入力で最初から「対象外」にする）
const NONTAX_DEFAULT = ['租税公課','損害保険料','給料賃金','利子割引料','減価償却費','貸倒金','雑収入'];
const TAX_OPTS = [['10','10%'],['8-reduced','8%（軽減）'],['0','対象外・非課税']];
const SIMPLE_RATES = [[90,'第1種　卸売業（90%）'],[80,'第2種　小売業など（80%）'],[70,'第3種　製造業・建設業など（70%）'],[60,'第4種　飲食店業など（60%）'],[50,'第5種　サービス業など（50%）'],[40,'第6種　不動産業（40%）']];
const TYPE_LABEL = {opening:'期首残高',depreciation:'減価償却',inventory:'棚卸',homeuse:'家事按分',closing:'旧・締め（集計外）'};
const TYPE_RANK = {opening:0,manual:1,depreciation:2,homeuse:3,inventory:4,closing:5};

/* ---------- 小道具 ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yen = n => (Math.round(n) || 0).toLocaleString('ja-JP');
const pad = n => String(n).padStart(2, '0');
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const yOf = t => +t.date.slice(0, 4);
const mOf = t => +t.date.slice(5, 7);
const clone = o => JSON.parse(JSON.stringify(o));
const parseAmt = v => { const n = parseInt(String(v ?? '').replace(/[,，\s円¥￥]/g, '').replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)), 10); return isNaN(n) ? NaN : n; };
const rateOf = r => r === '10' ? 0.1 : (r === '8' || r === '8-reduced') ? 0.08 : 0;
const taxLabel = e => e.isTaxable && rateOf(e.taxRate) > 0 ? (rateOf(e.taxRate) === 0.1 ? '10%' : '8%軽減') : '';
const sum = arr => arr.reduce((s, v) => s + v, 0);
let lastId = 0;
function newId() { let id = Date.now(); if (id <= lastId) id = lastId + 1; lastId = id; return id; }

/* ---------- データ ---------- */
let state, view, TYPE = {};

function defaultState() {
  const accountSettings = {};
  for (const a in DEFAULT_COST) accountSettings[a] = {costType: DEFAULT_COST[a]};
  return {
    version: 2, transactions: [], accounts: clone(DEFAULT_ACCOUNTS), accountSettings,
    descriptionTemplates: [], fixedAssets: [], batchTemplates: [], homeUse: {},
    settings: {businessName: '', taxMethod: 'exempt', simpleRate: 50, blueDeduction: 65, lastBackup: null, yayoi: yayoiDefaults()}
  };
}
function defaultView() {
  return {sec: 'home', sub: {input:'easy', books:'list', reports:'fs', closing:'fa', settings:'basic'}, year: new Date().getFullYear(), month: 'all'};
}

// 古い形式（パソコン版V3.7など）のデータも読めるように整える
function migrateTx(tx) {
  if (!tx || !tx.date || !Array.isArray(tx.debits) || !Array.isArray(tx.credits)) return null;
  tx = clone(tx);
  tx.date = String(tx.date).slice(0, 10);
  tx.type = tx.type || 'manual';
  const fix = e => { e.amount = Number(e.amount) || 0; e.taxRate = String(e.taxRate ?? '0'); e.taxAmount = Number(e.taxAmount) || 0; e.isTaxable = !!e.isTaxable; };
  if (!tx.debits.some(d => d.isTaxable !== undefined) && !tx.credits.some(c => c.isTaxable !== undefined)) {
    const paid = tx.debits.find(d => d.account === '仮払消費税等');
    const recv = tx.credits.find(c => c.account === '仮受消費税等');
    const mark = (list, taxAmt, taxAcc) => list.forEach(e => {
      if (e.account === taxAcc) { e.isTaxAccount = true; return; }
      e.isTaxable = true; e.taxAmount = taxAmt;
      const r = Math.round(taxAmt / (e.amount || 1) * 100); e.taxRate = (r >= 7 && r <= 9) ? '8-reduced' : '10';
    });
    if (tx.type === 'manual' && paid) { mark(tx.debits, paid.amount, '仮払消費税等'); tx.credits.forEach(c => { c.isTaxable = false; c.taxRate = '0'; }); }
    else if (tx.type === 'manual' && recv) { mark(tx.credits, recv.amount, '仮受消費税等'); tx.debits.forEach(d => { d.isTaxable = false; d.taxRate = '0'; }); }
    else { [...tx.debits, ...tx.credits].forEach(e => { e.isTaxable = false; e.taxRate = '0'; }); }
  }
  // 税抜経理の名残（仮払・仮受消費税）を本体の科目に足して税込にする
  const pi = tx.debits.findIndex(d => d.account === '仮払消費税等' || d.isTaxAccount);
  if (pi !== -1) { const a = tx.debits[pi].amount; tx.debits.splice(pi, 1); const m = tx.debits.find(d => d.isTaxable) || tx.debits[0]; if (m) m.amount += a; }
  const ri = tx.credits.findIndex(c => c.account === '仮受消費税等' || c.isTaxAccount);
  if (ri !== -1) { const a = tx.credits[ri].amount; tx.credits.splice(ri, 1); const m = tx.credits.find(c => c.isTaxable) || tx.credits[0]; if (m) m.amount += a; }
  tx.debits = tx.debits.filter(d => !d.isTaxAccount && d.account !== '仮払消費税等' && d.account !== '仮受消費税等');
  tx.credits = tx.credits.filter(c => !c.isTaxAccount && c.account !== '仮受消費税等' && c.account !== '仮払消費税等');
  [...tx.debits, ...tx.credits].forEach(e => { delete e.isTaxAccount; fix(e); });
  if (!tx.debits.length || !tx.credits.length) return null;
  return tx;
}
function normalize(s) {
  if (!s || !Array.isArray(s.transactions)) throw new Error('会計データの形式ではありません');
  const d = defaultState();
  const out = Object.assign(d, s);
  out.settings = Object.assign(defaultState().settings, s.settings || {});
  const yd = yayoiDefaults(), ys = (s.settings && s.settings.yayoi) || {};
  out.settings.yayoi = {acct: Object.assign(yd.acct, ys.acct || {}), tax: Object.assign(yd.tax, ys.tax || {})};
  out.accounts = (s.accounts && Object.keys(s.accounts).length) ? clone(s.accounts) : clone(DEFAULT_ACCOUNTS);
  for (const c of CAT_ORDER) if (!Array.isArray(out.accounts[c])) out.accounts[c] = [];
  const all = () => Object.values(out.accounts).flat();
  for (const c in CORE) for (const a of CORE[c]) if (!all().includes(a)) out.accounts[c].push(a);
  out.accountSettings = s.accountSettings || defaultState().accountSettings;
  out.descriptionTemplates = Array.isArray(s.descriptionTemplates) ? s.descriptionTemplates : [];
  out.fixedAssets = (Array.isArray(s.fixedAssets) ? s.fixedAssets : []).map(a => ({...a, account: a.account || '工具器具備品', businessRatio: a.businessRatio ?? 100, acquisitionCost: Number(a.acquisitionCost) || 0, usefulLife: Number(a.usefulLife) || 1}));
  out.batchTemplates = Array.isArray(s.batchTemplates) ? s.batchTemplates : [];
  out.homeUse = s.homeUse || {};
  out.transactions = s.transactions.map(migrateTx).filter(Boolean);
  for (const k of ['activeTab','selectedYear','selectedMonth','app','exportedAt']) delete out[k];
  out.version = 2;

// 税込経理。消費税の対象になる側（収益・費用・固定資産）に税額の情報を持たせる
function createTx(date, dAcct, cAcct, amount, taxRate, desc, type = 'manual') {
  const r = rateOf(taxRate), dT = typeOf(dAcct), cT = typeOf(cAcct);
  let side = null;
  if (r > 0) {
    if (cT === '収益') side = 'c';
    else if (dT === '費用' || (dT === '資産' && FIXED.includes(dAcct))) side = 'd';
    else if (dT === '収益') side = 'd';
    else if (cT === '費用' || (cT === '資産' && FIXED.includes(cAcct))) side = 'c';
  }
  const tax = side ? Math.floor(amount * r / (1 + r)) : 0;
  const ent = (account, on) => ({account, amount, taxRate: on ? taxRate : '0', taxAmount: on ? tax : 0, isTaxable: on});
  return {id: newId(), date, description: desc || '', debits: [ent(dAcct, side === 'd')], credits: [ent(cAcct, side === 'c')], type, taxIgnored: r > 0 && !side};
}
function checkTxInput(date, d, c, amount) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date || '')) return '日付を入れてください。';
  if (!d || !c) return '勘定科目を選んでください。';
  if (d === c) return '借方と貸方に同じ科目が選ばれています。';
  if (isNaN(amount) || amount <= 0) return '金額を正しく入れてください（1円以上）。';
  return '';
}

}

const calcTxs = () => state.transactions.filter(t => t.type !== 'closing');
const txsIn = (y, m) => calcTxs().filter(t => yOf(t) === y && (m === 'all' || mOf(t) === m));
const txsYTD = (y, m) => calcTxs().filter(t => yOf(t) === y && mOf(t) <= (m === 'all' ? 12 : m));
function flows(txs) {
  const b = {};
  for (const t of txs) {
    for (const e of t.debits) (b[e.account] = b[e.account] || {d: 0, c: 0}).d += e.amount;
    for (const e of t.credits) (b[e.account] = b[e.account] || {d: 0, c: 0}).c += e.amount;
  }
  return b;
}
function net(a, f) { const x = f[a]; if (!x) return 0; const t = typeOf(a); return (t === '資産' || t === '費用') ? x.d - x.c : x.c - x.d; }
function pl(f) {
  const rev = state.accounts['収益'].map(a => [a, net(a, f)]).filter(r => r[1] !== 0);
  const revenue = sum(rev.map(r => r[1]));
  const cogs = net('仕入', f);
  const exps = state.accounts['費用'].filter(a => a !== '仕入').map(a => [a, net(a, f)]).filter(r => r[1] !== 0);
  const expTotal = sum(exps.map(r => r[1]));
  return {rev, revenue, cogs, gross: revenue - cogs, exps, expTotal, profit: revenue - cogs - expTotal};
}
const cashAccounts = () => state.accounts['資産'].filter(a => /現金|預金/.test(a));
function taxCalc(txs) {
  const per = {}; let salesTax = 0, purTax = 0;
  const add = (e, sign) => {
    const ty = typeOf(e.account); if (!['収益','費用','資産'].includes(ty)) return;
    const r = e.isTaxable ? rateOf(e.taxRate) : 0;
    if (ty === '資産' && !r) return;
    const s = per[e.account] = per[e.account] || {type: ty, g10: 0, t10: 0, g8: 0, t8: 0, non: 0};
    if (r) { const k = r === 0.1 ? '10' : '8'; s['g' + k] += sign * e.amount; s['t' + k] += sign * (e.taxAmount || 0); if (ty === '収益') salesTax += sign * (e.taxAmount || 0); else purTax += sign * (e.taxAmount || 0); }
    else s.non += sign * e.amount;
  };
  for (const t of txs) {
    if (t.type === 'opening' || t.type === 'inventory') continue;
    for (const e of t.debits) add(e, typeOf(e.account) === '収益' ? -1 : 1);
    for (const e of t.credits) add(e, typeOf(e.account) === '収益' ? 1 : -1);
  }
  return {per, salesTax, purTax};
}
function taxMethods(tc) {
  const st = Math.max(0, tc.salesTax), sr = state.settings.simpleRate;
  return [
    {k: 'exempt', name: '免税事業者', amt: 0, note: '消費税の申告・納税なし'},
    {k: 'general', name: '原則課税', amt: tc.salesTax - tc.purTax, note: '預かった税 − 支払った税'},
    {k: 'simple', name: `簡易課税（みなし仕入率${sr}%）`, amt: Math.floor(st * (1 - sr / 100)), note: `預かった税 × ${100 - sr}%`},
    {k: 'niwari', name: '2割特例（インボイス登録した元免税事業者）', amt: Math.floor(st * 0.2), note: '預かった税 × 20%（使える年は限られます）'}
  ];
}
const taxEstimate = tc => taxMethods(tc).find(m => m.k === state.settings.taxMethod) || taxMethods(tc)[0];

// 減価償却（定額法。一括償却資産は3年均等）
function depFor(a, year) {
  const ay = +a.acquisitionDate.slice(0, 4), am = +a.acquisitionDate.slice(5, 7), cost = a.acquisitionCost;
  if (!ay || year < ay) return {dep: 0, before: 0, end: year < ay ? null : cost};
  const lump = a.account === '一括償却資産';
  const rate = Math.ceil(1000 / Math.max(1, a.usefulLife) - 1e-9) / 1000;
  let acc = 0;
  for (let y = ay; y <= year; y++) {
    let d;
    if (lump) d = y - ay < 3 ? Math.floor(cost / 3) + (y - ay === 2 ? cost - Math.floor(cost / 3) * 3 : 0) : 0;
    else d = Math.ceil(cost * rate * (y === ay ? 13 - am : 12) / 12);
    d = Math.max(0, Math.min(d, cost - (lump ? 0 : 1) - acc));
    if (y === year) return {dep: d, before: acc, end: cost - acc - d};
    acc += d;
  }
}

function niceStep(x) { if (x <= 0) return 1; const p = 10 ** Math.floor(Math.log10(x)); const f = x / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; }
const shortYen = v => Math.abs(v) >= 10000 ? (v / 10000).toLocaleString('ja-JP', {maximumFractionDigits: 1}) + '万' : String(v);
function barChart(labels, series, h = 240) {
  const W = 640, H = h, L = 52, R = 8, T = 10, B = 26;
  const vals = series.flatMap(s => s.data);
  let max = Math.max(0, ...vals), min = Math.min(0, ...vals); if (max === min) max = min + 10000;
  const step = niceStep((max - min) / 4); max = Math.ceil(max / step) * step; min = Math.floor(min / step) * step;
  const y = v => T + (max - v) / (max - min) * (H - T - B);
  const gw = (W - L - R) / labels.length, bw = Math.min(20, (gw - 6) / series.length);
  let s = '';
  for (let v = min; v <= max + 1e-6; v += step) s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="${v === 0 ? '#9aa3b5' : '#e6e9f0'}"/><text x="${L - 6}" y="${y(v) + 4}" font-size="11" text-anchor="end" fill="#5d6678">${shortYen(v)}</text>`;
  labels.forEach((lb, i) => {
    const x0 = L + i * gw + (gw - bw * series.length) / 2;
    series.forEach((se, k) => { const v = se.data[i] || 0; if (!v) return; s += `<rect x="${x0 + k * bw}" y="${Math.min(y(v), y(0))}" width="${bw - 2}" height="${Math.max(1, Math.abs(y(v) - y(0)))}" rx="2" fill="${se.color}"><title>${lb} ${se.name}：${yen(v)}円</title></rect>`; });
    s += `<text x="${L + i * gw + gw / 2}" y="${H - 8}" font-size="11" text-anchor="middle" fill="#5d6678">${lb}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${s}</svg><div class="legend">${series.map(se => `<span><i style="background:${se.color}"></i>${se.name}</span>`).join('')}</div>`;
}

      <td>${esc(t.description)}${TYPE_LABEL[t.type] ? `<span class="badge ${t.type === 'closing' ? 'gray' : 'org'}">${TYPE_LABEL[t.type]}</span>` : ''}</td>
      <td class="acts">${t.type === 'manual' && t.debits.length === 1 && t.credits.length === 1 ? `<button class="btn sm ghost" data-act="editTx" data-id="${t.id}">直す</button><button class="btn sm ghost" data-act="dupTx" data-id="${t.id}">複製</button>` : ''}<button class="btn sm ghost" style="color:var(--bad)" data-act="delTx" data-id="${t.id}">削除</button></td></tr>`).join('')
      : `<tr><td colspan="7" class="empty">この期間の仕訳はありません</td></tr>`}
    </tbody></table></div></div>`;
};
CH.listQ = el => { listFilter.q = el.value; render(); };
CH.listAcct = el => { listFilter.acct = el.value; render(); };
A.delTx = async el => {
  const id = +el.dataset.id, t = state.transactions.find(x => x.id === id); if (!t) return;
  const auto = t.type !== 'manual' ? '\n（自動で作った仕訳です。必要ならあとで作り直してください）' : '';
  if (!await uiConfirm(`${t.date}　${esc(t.debits[0].account)} ／ ${esc(t.credits[0].account)}　${yen(t.debits[0].amount)}円\nこの仕訳を削除しますか？${auto}`, {danger: true, ok: '削除'})) return;
  change(() => state.transactions = state.transactions.filter(x => x.id !== id), '仕訳を削除しました');
};
async function txDialog(t, dup) {
  const d = t.debits[0], c = t.credits[0];
  const rate = d.isTaxable ? d.taxRate : c.isTaxable ? c.taxRate : '0';
  const r = await modal({title: dup ? '複製して登録' : '仕訳を直す', wide: true, body: `
    <label class="f">日付</label><input type="date" class="inp" id="m-date" value="${dup ? todayStr() : t.date}">

    <div class="grid" style="grid-template-columns:1fr 1fr;gap:10px"><div><label class="f">金額（税込）</label><input class="inp" style="text-align:right" inputmode="numeric" id="m-amt" value="${d.amount}"></div><div><label class="f">消費税</label>${taxSelect(rate, 'id="m-tax"')}</div></div>
    <label class="f">摘要</label><input class="inp" id="m-desc" value="${esc(t.description)}">`,
    buttons: [{label: 'やめる', value: null}, {label: dup ? '登録する' : '保存する', cls: 'pri', collect: root => {
      const v = {date: $('#m-date', root).value, d: $('#m-d', root).value, c: $('#m-c', root).value, amt: parseAmt($('#m-amt', root).value), tax: $('#m-tax', root).value, desc: $('#m-desc', root).value.trim()};
      const err = checkTxInput(v.date, v.d, v.c, v.amt); return err ? {error: err} : v;
    }}]});
  if (!r) return;
  const nt = createTx(r.date, r.d, r.c, r.amt, r.tax, r.desc);
  if (dup) addTxs([nt], '複製して登録しました');
  else change(() => { nt.id = t.id; delete nt.taxIgnored; const i = state.transactions.findIndex(x => x.id === t.id); state.transactions[i] = nt; }, '仕訳を直しました');
}
A.editTx = el => { const t = state.transactions.find(x => x.id === +el.dataset.id); if (t) txDialog(t, false); };
A.dupTx = el => { const t = state.transactions.find(x => x.id === +el.dataset.id); if (t) txDialog(t, true); };

/* =========================================================
   帳簿：総勘定元帳
   ========================================================= */
let ledgerAcct = '';
V['books.ledger'] = () => {
  if (!ledgerAcct || !typeOf(ledgerAcct)) ledgerAcct = '普通預金';
  const a = ledgerAcct, ty = typeOf(a), y = view.year;
  const sign = (ty === '資産' || ty === '費用') ? 1 : -1;
  const yearTx = calcTxs().filter(t => yOf(t) === y && [...t.debits, ...t.credits].some(e => e.account === a));
  const before = view.month === 'all' ? [] : yearTx.filter(t => mOf(t) < view.month);
  const rows = view.month === 'all' ? yearTx : yearTx.filter(t => mOf(t) === view.month);
  let bal = sign * sum(before.map(t => sum(t.debits.filter(e => e.account === a).map(e => e.amount)) - sum(t.credits.filter(e => e.account === a).map(e => e.amount))));
  let dT = 0, cT = 0;
  const body = rows.map(t => {
    const dv = sum(t.debits.filter(e => e.account === a).map(e => e.amount)), cv = sum(t.credits.filter(e => e.account === a).map(e => e.amount));
    dT += dv; cT += cv; bal += sign * (dv - cv);
    const other = [...new Set((dv ? t.credits : t.debits).map(e => e.account).filter(x => x !== a))];
    return `<tr><td style="white-space:nowrap">${t.date.slice(5).replace('-', '/')}</td><td>${other.length === 1 ? esc(other[0]) : '諸口'}</td><td>${esc(t.description)}${TYPE_LABEL[t.type] ? `<span class="badge org">${TYPE_LABEL[t.type]}</span>` : ''}</td><td class="num">${dv ? yen(dv) : ''}</td><td class="num">${cv ? yen(cv) : ''}</td><td class="num">${yen(bal)}</td></tr>`;
  }).join('');
  return `<div class="card"><div class="row" style="margin-bottom:12px"><span>勘定科目</span><select class="inp" style="width:auto;min-width:200px" data-change="ledgerAcct">${acctOptions(a, CAT_ORDER, '')}</select></div>
    <div class="tbl-wrap"><table><thead><tr><th>日付</th><th>相手科目</th><th>摘要</th><th class="num">借方</th><th class="num">貸方</th><th class="num">残高</th></tr></thead><tbody>
    ${view.month !== 'all' ? `<tr><td></td><td colspan="4" class="muted">前月までの繰越</td><td class="num">${yen(sign * sum(before.map(t => sum(t.debits.filter(e => e.account === a).map(e => e.amount)) - sum(t.credits.filter(e => e.account === a).map(e => e.amount)))))}</td></tr>` : ''}
    ${body || `<tr><td colspan="6" class="empty">この期間の取引はありません</td></tr>`}
    ${rows.length ? `<tr class="tot"><td colspan="3">合計</td><td class="num">${yen(dT)}</td><td class="num">${yen(cT)}</td><td class="num">${yen(bal)}</td></tr>` : ''}
    </tbody></table></div></div>`;
};
CH.ledgerAcct = el => { ledgerAcct = el.value; render(); };

/* =========================================================
   集計：決算書（損益計算書・貸借対照表）
   ========================================================= */
const ln = (l, v, cls = '') => `<div class="ln ${cls}"><span>${l}</span><span class="num">${v === '' ? '' : yen(v)}</span></div>`;
V['reports.fs'] = () => {
  const y = view.year, m = view.month;
  const p = pl(flows(txsIn(y, m)));
  const blue = state.settings.blueDeduction;
  const inv = state.transactions.some(t => t.type === 'inventory' && yOf(t) === y);
  let plh = `<div class="stmt">` + ln('売上（収入）金額', '', 'h') + p.rev.map(r => ln(esc(r[0]), r[1], 'in')).join('') + ln('売上（収入）金額 計', p.revenue, 't');
  plh += ln('売上原価', '', 'h') + ln('仕入（棚卸調整後）', p.cogs, 'in') + ln('差引金額（粗利）', p.gross, 't');
  plh += ln('経費', '', 'h') + (p.exps.length ? p.exps.map(r => ln(esc(r[0]), r[1], 'in')).join('') : '<div class="ln in muted"><span>なし</span><span></span></div>') + ln('経費 計', p.expTotal, 't');
  plh += ln(`所得金額（青色申告特別控除前）`, p.profit, 't big');
  if (m === 'all' && blue > 0) { const ded = Math.min(blue * 10000, Math.max(0, p.profit)); plh += ln(`青色申告特別控除（${blue}万円）`, -ded, 'in') + ln('所得金額', p.profit - ded, 't big'); }
  plh += `</div>${m === 'all' && p.cogs && !inv ? '<p class="note warn small" style="margin-top:10px">棚卸の仕訳がまだです。在庫がある場合は「決算 → 棚卸」で計上してください。</p>' : ''}`;

  const f = flows(txsYTD(y, m)), pYTD = pl(f);
  const L = c => state.accounts[c].map(a => [a, net(a, f)]).filter(r => r[1] !== 0);
  const as = L('資産'), ca = L('控除資産'), li = L('負債'), eq = L('純資産');
  const tA = sum(as.map(r => r[1])) - sum(ca.map(r => r[1])), tL = sum(li.map(r => r[1])), tE = sum(eq.map(r => r[1]));
  const diff = tA - (tL + tE + pYTD.profit);
  let bsh = `<div class="stmt">` + ln('資産', '', 'h') + as.map(r => ln(esc(r[0]), r[1], 'in')).join('') + ca.map(r => ln(`（${esc(r[0])}）`, -r[1], 'in')).join('') + ln('資産 合計', tA, 't');
  bsh += ln('負債', '', 'h') + (li.length ? li.map(r => ln(esc(r[0]), r[1], 'in')).join('') : '<div class="ln in muted"><span>なし</span><span></span></div>') + ln('負債 合計', tL, 't');
  bsh += ln('資本', '', 'h') + eq.map(r => ln(esc(r[0]), r[1], 'in')).join('') + ln('青色申告特別控除前の所得金額', pYTD.profit, 'in') + ln('負債・資本 合計', tL + tE + pYTD.profit, 't');
  bsh += `</div>` + (Math.abs(diff) > 0 ? `<p class="note bad small" style="margin-top:10px">左右の合計が ${yen(diff)}円 合いません。削除した科目が仕訳に残っている可能性があります。</p>` : `<p class="note ok small" style="margin-top:10px">✓ 資産合計と負債・資本合計が一致しています</p>`);
  return `<div class="grid g2"><div class="card"><h2>損益計算書　<span class="small muted">${periodLabel()}・税込</span></h2>${plh}</div>
    <div class="card"><h2>貸借対照表　<span class="small muted">${m === 'all' ? `${y}年12月末` : `${y}年${m}月末`}時点・税込</span></h2>${bsh}</div></div>
    <p class="small muted">※青色申告決算書の形に近い並びです。申告書に写すときは、科目の名前を合わせてください。<button class="btn sm ghost no-print" onclick="print()">印刷する</button></p>`;
};

/* =========================================================

V['reports.tb'] = () => {

  }

    <div class="tbl-wrap"><table><thead><tr><th>勘定科目</th><th class="num">借方合計</th><th class="num">貸方合計</th><th class="num">残高</th></tr></thead><tbody>${rows || '<tr><td colspan="4" class="empty">データがありません</td></tr>'}
    <tr class="tot"><td>合計</td><td class="num">${yen(tD)}</td><td class="num">${yen(tC)}</td><td>${tD === tC ? '<span class="plus">✓ 一致</span>' : '<span class="minus">不一致</span>'}</td></tr></tbody></table></div></div>`;
};

V['reports.tax'] = () => {
  const tc = taxCalc(txsIn(view.year, view.month));

      ${list.map(([a, s]) => `<tr><td>${esc(a)}</td><td class="num"><b>${yen(s.g10 + s.g8 + s.non)}</b></td><td class="num">${yen(s.non)}</td><td class="num">${yen(s.g10)}</td><td class="num">${yen(s.t10)}</td><td class="num">${yen(s.g8)}</td><td class="num">${yen(s.t8)}</td></tr>`).join('')}
      <tr class="tot"><td>合計</td><td class="num">${yen(T('g10') + T('g8') + T('non'))}</td><td class="num">${yen(T('non'))}</td><td class="num">${yen(T('g10'))}</td><td class="num">${yen(T('t10'))}</td><td class="num">${yen(T('g8'))}</td><td class="num">${yen(T('t8'))}</td></tr></tbody></table></div>`;
  };
  const ms = taxMethods(tc);
  return `<div class="card"><h2>消費税の納付見込み　<span class="small muted">${periodLabel()}</span></h2>
    <div class="grid g3" style="margin-bottom:10px"><div class="kpi" style="background:var(--soft)"><div class="l">預かった消費税（売上）</div><div class="v">${yen(tc.salesTax)}<small>円</small></div></div><div class="kpi" style="background:var(--soft)"><div class="l">支払った消費税（経費・仕入・設備）</div><div class="v">${yen(tc.purTax)}<small>円</small></div></div></div>
    <div class="tbl-wrap"><table><thead><tr><th>計算の方法</th><th>計算</th><th class="num">納付見込み</th></tr></thead><tbody>
    ${ms.map(x => `<tr ${x.k === state.settings.taxMethod ? 'style="background:var(--pri-weak);font-weight:700"' : ''}><td>${x.k === state.settings.taxMethod ? '▶ ' : ''}${x.name}</td><td class="small">${x.note}</td><td class="num">${yen(x.amt)}円</td></tr>`).join('')}
    </tbody></table></div>
    <p class="small muted" style="margin-top:8px">▶ が「設定 → 基本設定」で選んでいる方法です。金額は帳簿の税込金額から出したおおよその額です。実際の申告では国税・地方消費税の計算や端数処理があるため、税務署や税理士に確認してください。</p></div>
    <div class="card"><h2>科目ごとの内訳</h2>${table('売上・収入', '収益')}${table('経費・仕入', '費用')}${table('設備など（固定資産）', '資産')}</div>`;
};

/* =========================================================
   集計：グラフ
   ========================================================= */
V['reports.charts'] = () => {
  const y = view.year, mo = monthly(y), p = pl(flows(txsIn(y, 'all')));
  const ex = [...p.exps, ['仕入（売上原価）', p.cogs]].filter(r => r[1] > 0).sort((a, b) => b[1] - a[1]);
  const max = Math.max(1, ...ex.map(r => r[1]));
  let cum = 0;
  return `<div class="card"><h2>月ごとの売上と経費</h2>${barChart(MONTH_LABELS, [{name: '売上・収入', color: '#2457c5', data: mo.sales}, {name: '仕入・経費', color: '#e0782b', data: mo.exp}], 260)}</div>
    <div class="grid g2"><div class="card"><h2>経費の内訳（${y}年）</h2>${ex.length ? ex.map(r => `<div class="hbar"><span>${esc(r[0])}</span><div class="bar" style="width:${Math.max(1, r[1] / max * 100)}%"></div><span class="num">${yen(r[1])}</span></div>`).join('') : '<div class="empty">データがありません</div>'}</div>
    <div class="card"><h2>月ごとのもうけ</h2><div class="tbl-wrap"><table><thead><tr><th>月</th><th class="num">売上</th><th class="num">経費</th><th class="num">もうけ</th><th class="num">累計</th></tr></thead><tbody>
    ${mo.sales.map((s, i) => { cum += mo.profit[i]; return `<tr><td>${i + 1}月</td><td class="num">${yen(s)}</td><td class="num">${yen(mo.exp[i])}</td><td class="num ${mo.profit[i] < 0 ? 'minus' : ''}">${yen(mo.profit[i])}</td><td class="num">${yen(cum)}</td></tr>`; }).join('')}
    </tbody></table></div><p class="small muted">決算整理（減価償却など）は含みません。</p></div></div>`;
};

/* =========================================================
   集計：お金の流れ（キャッシュ・フロー）
   ========================================================= */
V['reports.cf'] = () => {
  const y = view.year, m = view.month, all = calcTxs().filter(t => yOf(t) === y);
  const S = flows(all.filter(t => t.type === 'opening' || (m !== 'all' && mOf(t) < m)));
  const P = flows(all.filter(t => t.type !== 'opening' && (m === 'all' || mOf(t) === m)));
  const cashA = cashAccounts();
  const op = [['もうけ（所得）', pl(P).profit]];
  for (const a of state.accounts['控除資産']) { const v = net(a, P); if (v) op.push([`${a}（お金の出ない費用）`, v]); }
  for (const a of state.accounts['資産']) if (!cashA.includes(a) && !FIXED.includes(a) && a !== '事業主貸') { const v = -net(a, P); if (v) op.push([`${a}の${v < 0 ? '増加' : '減少'}`, v]); }
  for (const a of state.accounts['負債']) if (!['借入金','事業主借'].includes(a)) { const v = net(a, P); if (v) op.push([`${a}の${v > 0 ? '増加' : '減少'}`, v]); }
  const inv = FIXED.filter(typeOf).map(a => [`${a}の取得・売却`, -net(a, P)]).filter(r => r[1]);
  const fin = [];
  for (const a of state.accounts['負債']) if (['借入金','事業主借'].includes(a)) { const v = net(a, P); if (v) fin.push([a === '借入金' ? '借入金の借入・返済' : '事業主借（個人からの入金）', v]); }
  for (const a of state.accounts['資産']) if (a === '事業主貸') { const v = -net(a, P); if (v) fin.push(['事業主貸（生活費などへ）', v]); }
  for (const a of state.accounts['純資産']) { const v = net(a, P); if (v) fin.push([a, v]); }
  const sec = (t, rows) => { const s = sum(rows.map(r => r[1])); return `<div class="stmt">${ln(t, '', 'h')}${rows.map(r => ln(esc(r[0]), r[1], 'in')).join('') || '<div class="ln in muted"><span>なし</span><span></span></div>'}${ln(t + ' 計', s, 't')}</div>`; };
  const start = sum(cashA.map(a => net(a, S))), chg = sum(cashA.map(a => net(a, P)));
  return `<div class="card"><h2>お金の流れ　<span class="small muted">${periodLabel()}</span></h2>
    <p class="small muted">もうけと、手元のお金（${cashA.map(esc).join('・')}）の増減がちがう理由がわかります。</p>
    ${sec('営業（ふだんの商売）', op)}${sec('設備への投資', inv)}${sec('借入・個人とのお金のやりとり', fin)}
    <div class="stmt" style="margin-top:12px">${ln('期間はじめのお金', start)}${ln('期間中の増減', chg, 't')}${ln('期間おわりのお金', start + chg, 't big')}</div></div>`;
};

/* =========================================================
   集計：損益分岐点
   ========================================================= */
V['reports.bep'] = () => {
  const p = pl(flows(txsIn(view.year, 'all')));
  let fixed = 0, vari = 0; const unset = [];
  for (const [a, v] of [['仕入', p.cogs], ...p.exps]) {
    if (!v) continue;
    const t = (state.accountSettings[a] || {}).costType || (a === '仕入' ? 'variable' : '');
    if (t === 'fixed') fixed += v; else if (t === 'variable') vari += v; else { fixed += v; unset.push(a); }
  }
  if (!p.revenue) return `<div class="card empty">売上を入力すると分析できます。</div>`;
  const vr = vari / p.revenue, mr = 1 - vr, bep = mr > 0 ? fixed / mr : Infinity;
  const safety = isFinite(bep) ? (p.revenue - bep) / p.revenue : -1;
  return `<div class="card"><h2>損益分岐点（${view.year}年）</h2>
    <div class="kpis"><div class="kpi" style="background:var(--soft)"><div class="l">売上</div><div class="v">${yen(p.revenue)}<small>円</small></div></div>

A.huPost = async () => {
  const y = view.year;
  const base = calcTxs().filter(t => yOf(t) === y && t.type !== 'homeuse');
  const credits = [];
  for (const a of state.accounts['費用']) {
    const pct = state.homeUse[a] ?? 100; if (pct >= 100 || HU_SKIP.includes(a)) continue;
    const bk = {}; // 税率ごとに分ける（消費税の計算のため）
    for (const t of base) {
      for (const e of t.debits) if (e.account === a) { const k = e.isTaxable && rateOf(e.taxRate) ? e.taxRate : '0'; (bk[k] = bk[k] || {g: 0, t: 0}).g += e.amount; bk[k].t += e.taxAmount || 0; }
      for (const e of t.credits) if (e.account === a) { const k = e.isTaxable && rateOf(e.taxRate) ? e.taxRate : '0'; (bk[k] = bk[k] || {g: 0, t: 0}).g -= e.amount; bk[k].t -= e.taxAmount || 0; }
    }
    for (const k in bk) { const g = Math.round(bk[k].g * (100 - pct) / 100), tx = Math.round(bk[k].t * (100 - pct) / 100); if (g > 0) credits.push({account: a, amount: g, taxRate: k, taxAmount: k === '0' ? 0 : tx, isTaxable: k !== '0'}); }
  }
  const tot = sum(credits.map(e => e.amount));
  if (!tot && !state.transactions.some(t => t.type === 'homeuse' && yOf(t) === y)) { uiAlert('振り替える金額がありません。'); return; }
  if (!await uiConfirm(tot ? `生活の分 ${yen(tot)}円 を「事業主貸」に振り替えます。` : '割合がすべて100%なので、計上ずみの家事按分を取り消します。')) return;
  change(() => {
    state.transactions = state.transactions.filter(t => !(t.type === 'homeuse' && yOf(t) === y));
    if (tot) state.transactions.push({id: newId(), date: `${y}-12-31`, description: `${y}年 家事按分`, debits: [{account: '事業主貸', amount: tot, taxRate: '0', taxAmount: 0, isTaxable: false}], credits, type: 'homeuse'});
  }, '家事按分を計上しました');
};

function closingBalances(y) {
  const f = flows(txsYTD(y, 12));
  const lines = [];
  for (const c of ['資産','負債','純資産','控除資産']) for (const a of state.accounts[c]) { if (a === '事業主貸' || a === '事業主借' || c === '純資産') continue; const v = net(a, f); if (v) lines.push({a, c, v}); }
  const assets = sum(lines.filter(l => l.c === '資産').map(l => l.v)), other = sum(lines.filter(l => l.c !== '資産').map(l => l.v));
  return {f, lines, capital: assets - other};
}

}
async function shareFile(text, filename, mime, title) {
  const file = new File([text], filename, {type: mime});

    try { await navigator.share({files: [file], title, text: title}); return true; }
    catch (e) { if (e.name === 'AbortError') return false; }

  await uiAlert('この画面からは直接送れませんでした。\nファイルを端末に保存するので、メールアプリなどで添付して送ってください。');
  download(text, filename, mime); return true;
}

const YAYOI_TAX_GUESS = {s8: '課税売上込軽減8%', p8: '課対仕入込軽減8%適格'};
function yayoiDefaults() {
  return {

    tax: {s10: '課税売上込10%', p10: '課対仕入込10%適格', none: '対象外', ...YAYOI_TAX_GUESS}
  };
}
const YAYOI_TAX_LABELS = [['s10','売上 10%'],['s8','売上 8%（軽減）'],['p10','経費・仕入・設備 10%'],['p8','経費・仕入・設備 8%（軽減）'],['none','消費税なし（対象外・非課税）']];

// Shift-JIS（CP932）への変換表を、ブラウザの読み取り機能から作る（ネット不要）
let SJIS = null;
function sjisMap() {
  if (SJIS) return SJIS;
  SJIS = new Map();
  const dec = new TextDecoder('shift_jis'), b = new Uint8Array(2);
  for (let c = 0xA1; c <= 0xDF; c++) SJIS.set(dec.decode(new Uint8Array([c])), c);
  for (let l = 0x81; l <= 0xFC; l++) {
    if (l >= 0xA0 && l < 0xE0) continue;
    for (let t = 0x40; t <= 0xFC; t++) {
      if (t === 0x7F) continue;
      b[0] = l; b[1] = t;
      const s = dec.decode(b);
      if (s.length === 1 && s !== '�' && !SJIS.has(s)) SJIS.set(s, (l << 8) | t);
    }
  }
  return SJIS;
}
const SJIS_FIX = {'−': '－', '〜': '～', '‖': '∥', '—': '―', '¢': '￠', '£': '￡', '¬': '￢'};
function toSJIS(str, bad) {
  const m = sjisMap(), out = [];
  for (let ch of str) {
    if (SJIS_FIX[ch]) ch = SJIS_FIX[ch];
    const cp = ch.codePointAt(0);
    if (cp < 0x80) { out.push(cp); continue; }
    const v = m.get(ch);
    if (v === undefined) { if (bad) bad.add(ch); out.push(0x3F); }
    else if (v > 0xFF) out.push(v >> 8, v & 0xFF);
    else out.push(v);
  }
  return new Uint8Array(out);
}
// 弥生で表せない文字があるか（変換すると「?」になる文字）
function sjisBad(str) { const bad = new Set(); toSJIS(str, bad); return [...bad]; }

const wareki = d => { const y = +d.slice(0, 4); const era = d >= '2019-05-01' ? ['R', y - 2018] : ['H', y - 1988]; return `${era[0]}.${pad(era[1])}/${d.slice(5, 7)}/${d.slice(8, 10)}`; };

// 1つの仕訳を、弥生の「1行の仕訳」（借方1つ・貸方1つ）に分ける
function splitTx(t) {
  if (t.debits.length === 1 && t.credits.length === 1) return [{d: t.debits[0], c: t.credits[0], amt: t.debits[0].amount}];
  if (t.debits.length === 1) return t.credits.map(c => ({d: {...t.debits[0], isTaxable: false}, c, amt: c.amount}));
  if (t.credits.length === 1) return t.debits.map(d => ({d, c: {...t.credits[0], isTaxable: false}, amt: d.amount}));
  const shokuchi = {account: '諸口', isTaxable: false, raw: true};
  return [...t.debits.map(d => ({d, c: shokuchi, amt: d.amount})), ...t.credits.map(c => ({d: shokuchi, c, amt: c.amount}))];
}

function yayoiBuild(opt) {
  const Y = state.settings.yayoi;
  const name = e => e.raw ? e.account : ((Y.acct[e.account] || '').trim() || e.account);
  const taxOf = e => {
    const r = e.isTaxable ? rateOf(e.taxRate) : 0; if (!r) return Y.tax.none;
    const sales = typeOf(e.account) === '収益';
    return r === 0.1 ? (sales ? Y.tax.s10 : Y.tax.p10) : (sales ? Y.tax.s8 : Y.tax.p8);
  };
  const clean = s => String(s ?? '').replace(/"/g, '”').replace(/,/g, '，').replace(/[\r\n\t]/g, ' ');
  const q = s => `"${clean(s)}"`;
  const txs = state.transactions.filter(t => t.date >= opt.from && t.date <= opt.to && t.type !== 'closing'
    && (opt.opening || t.type !== 'opening') && (opt.adj || !ADJ_TYPES.includes(t.type)));
  const lines = [], checks = [];
  let no = 0, dT = 0, cT = 0;
  for (const t of txs) {
    const pairs = splitTx(t);
    for (const p of pairs) {
      no++;
      const memo = [], need = [];
      if (TYPE_LABEL[t.type]) memo.push(`アプリで自動作成（${TYPE_LABEL[t.type]}）`);
      if (pairs.length > 1) memo.push(`元は複数行の仕訳（${pairs.length}行に分割）`);
      if (p.d.raw || p.c.raw) need.push('「諸口」を使用。弥生の期首残高の画面で入れる方法もあります');
      let desc = t.description || '';
      if ([...desc].length > 64) { desc = [...desc].slice(0, 64).join(''); need.push('摘要が64文字を超えたため切り詰め'); }
      for (const e of [p.d, p.c]) {
        const tx = taxOf(e);
        if ((tx === Y.tax.s8 && Y.tax.s8 === YAYOI_TAX_GUESS.s8) || (tx === Y.tax.p8 && Y.tax.p8 === YAYOI_TAX_GUESS.p8)) need.push(`税区分「${tx}」は見本にない表記。弥生の登録名と照合してください`);
      }
      const dName = name(p.d), cName = name(p.c);
      const bad = sjisBad(dName + cName + desc);
      if (bad.length) need.push(`絵文字など弥生で使えない文字が${bad.length}種類あり「?」に置きかわります`);
      const allMemo = [...need.map(n => '【要確認】' + n), ...memo].join(' ／ ');
      if (need.length) checks.push({no, date: t.date, text: `${dName} ／ ${cName}　${yen(p.amt)}円　${desc}`, why: [...new Set(need)]});
      dT += p.amt; cT += p.amt;
      lines.push([q('2000'), no, q(''), q(wareki(t.date)), q(dName), q(''), q(''), q(taxOf(p.d)), p.amt, 0,
        q(cName), q(''), q(''), q(taxOf(p.c)), p.amt, 0, q(desc), q(''), q(''), 0, q(''), q(allMemo), q('0'), q('0'), q('no')].join(','));
    }
  }
  return {text: lines.length ? lines.join('\r\n') + '\r\n' : '', count: lines.length, txCount: txs.length, dT, cT, checks};
}

const yy = {from: '', to: '', adj: true, opening: false};
function yyRange(kind) {
  const d = new Date(), y = d.getFullYear(), m = d.getMonth() + 1;
  const last = (yr, mo) => new Date(yr, mo, 0).getDate();
  if (kind === 'thisMonth') return [`${y}-${pad(m)}-01`, `${y}-${pad(m)}-${last(y, m)}`];
  if (kind === 'lastMonth') { const py = m === 1 ? y - 1 : y, pm = m === 1 ? 12 : m - 1; return [`${py}-${pad(pm)}-01`, `${py}-${pad(pm)}-${last(py, pm)}`]; }
  if (kind === 'lastYear') return [`${y - 1}-01-01`, `${y - 1}-12-31`];
  return [`${y}-01-01`, `${y}-12-31`];
}
V['settings.yayoi'] = () => {
  if (!yy.from) [yy.from, yy.to] = yyRange('thisYear');
  const r = yayoiBuild(yy), Y = state.settings.yayoi;
  const used = [...usedAccts()].filter(typeOf).sort((a, b) => CAT_ORDER.indexOf(typeOf(a)) - CAT_ORDER.indexOf(typeOf(b)));
  const preview = r.text.split('\r\n').slice(0, 4).join('\n');
  return `<div class="card"><h2>弥生会計に取り込むファイルをつくる</h2>
    <p class="small muted">弥生会計の「仕訳日記帳」のインポート形式（25項目・カンマ区切り・Shift-JIS）で書き出します。1行＝1仕訳（識別フラグ 2000）です。</p>
    <div class="chips" style="margin-bottom:6px">${[['thisMonth','今月'],['lastMonth','先月'],['thisYear','今年'],['lastYear','去年']].map(([k, l]) => `<button data-act="yyRange" data-k="${k}">${l}</button>`).join('')}</div>
    <div class="grid" style="grid-template-columns:1fr 1fr;gap:10px"><div><label class="f">はじめの日</label><input type="date" class="inp" value="${yy.from}" data-change="yyDate" data-k="from"></div><div><label class="f">おわりの日</label><input type="date" class="inp" value="${yy.to}" data-change="yyDate" data-k="to"></div></div>
    <label class="check"><input type="checkbox" data-change="yyOpt" data-k="adj" ${yy.adj ? 'checked' : ''}> 決算整理の仕訳（減価償却・家事按分・棚卸）も入れる</label>
    <label class="check"><input type="checkbox" data-change="yyOpt" data-k="opening" ${yy.opening ? 'checked' : ''}> 期首残高の仕訳も入れる（ふつうは入れない：弥生では期首残高を別の画面で入れます）</label>
    <div class="kpis" style="margin-top:10px"><div class="kpi" style="background:var(--soft)"><div class="l">書き出す行数</div><div class="v">${r.count}<small>行</small></div></div>
      <div class="kpi" style="background:var(--soft)"><div class="l">借方合計</div><div class="v">${yen(r.dT)}<small>円</small></div></div>
      <div class="kpi" style="background:var(--soft)"><div class="l">貸方合計</div><div class="v">${yen(r.cT)}<small>円</small></div></div></div>
    ${r.checks.length ? `<div class="note warn small"><b>【要確認】${r.checks.length}行</b>（ファイルの「仕訳メモ」にも書いてあります）<ul style="margin:6px 0 0;padding-left:20px">${r.checks.map(c => `<li>${c.no}行目　${c.date}　${esc(c.text)}<br>→ ${c.why.map(esc).join('<br>→ ')}</li>`).join('')}</ul></div>` : (r.count ? '<p class="note ok small">✓ 要確認の行はありません</p>' : '')}
    ${preview ? `<details class="help"><summary>中身を見る（はじめの数行）</summary><pre style="white-space:pre-wrap;word-break:break-all;font-size:12px;margin:0">${esc(preview)}</pre></details>` : ''}
    <div class="row" style="margin-top:12px"><button class="btn pri" data-act="yySend" ${r.count ? '' : 'disabled'}>📤 送る</button><button class="btn" data-act="yySave" ${r.count ? '' : 'disabled'}>💾 保存</button></div>
    <p class="small muted">弥生会計での取り込み：「ファイル」→「インポート」→ このファイルを選ぶ。取り込む前に弥生のバックアップをとっておくと安心です。</p></div>
    <div class="grid g2"><div class="card"><h2>科目名の対応</h2><p class="small muted">弥生で科目名がちがうものだけ直してください。空欄はアプリと同じ名前で書き出します。</p>
      ${used.length ? used.map(a => `<div class="list-item"><span>${esc(a)}</span><span class="row" style="flex-wrap:nowrap;gap:4px"><span class="muted">→</span><input class="inp" style="width:160px;min-height:40px" placeholder="${esc(a)}" value="${esc(Y.acct[a] || '')}" data-change="yyAcct" data-a="${esc(a)}"></span></div>`).join('') : '<div class="empty">まだ仕訳がありません</div>'}</div>
    <div class="card"><h2>税区分の表記</h2><p class="small muted">弥生に登録されている名前と同じにします。見本の表記を入れてあります。8%軽減の2つは見本になかったので、弥生の画面の表記と照らし合わせてください。</p>
      ${YAYOI_TAX_LABELS.map(([k, l]) => `<label class="f">${l}</label><input class="inp" value="${esc(Y.tax[k])}" data-change="yyTax" data-k="${k}">`).join('')}
      <p class="small muted">経費・仕入はすべて「適格」（インボイスあり）として書き出します。インボイスのない取引先の分は、弥生で税区分を直してください。</p></div></div>`;
};
A.yyRange = el => { [yy.from, yy.to] = yyRange(el.dataset.k); render(); };
CH.yyDate = el => { yy[el.dataset.k] = el.value; if (yy.from && yy.to && yy.from > yy.to) [yy.from, yy.to] = [yy.to, yy.from]; render(); };
CH.yyOpt = el => { yy[el.dataset.k] = el.checked; render(); };
CH.yyAcct = el => { const v = el.value.trim(); if (v) state.settings.yayoi.acct[el.dataset.a] = v; else delete state.settings.yayoi.acct[el.dataset.a]; save(); render(); toast('保存しました'); };
CH.yyTax = el => { const v = el.value.trim(); if (!v) { render(); return; } state.settings.yayoi.tax[el.dataset.k] = v; save(); render(); toast('保存しました'); };
function yayoiFile() {
  const r = yayoiBuild(yy);
  return {r, bytes: toSJIS(r.text), name: `弥生インポート_${yy.from.replace(/-/g, '')}-${yy.to.replace(/-/g, '')}.txt`};
}
A.yySave = () => { const f = yayoiFile(); download(f.bytes, f.name, 'text/plain'); toast(`${f.r.count}行を書き出しました（借方・貸方合計 ${yen(f.r.dT)}円）`); };
A.yySend = async () => { const f = yayoiFile(); if (await shareFile(f.bytes, f.name, 'text/plain', '弥生会計インポート用')) toast(`${f.r.count}行を書き出しました`); };

  <p class="note small">データはこのタブレットの中だけに保存されます。ネットがなくても使えます。そのかわり、<b>バックアップは自分でとる</b>必要があります（設定 → バックアップ・データ）。</p>
